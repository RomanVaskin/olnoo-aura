name: Production Deploy

"on":
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        timeout-minutes: 2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KZ_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.KZ_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to server
        timeout-minutes: 10
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.KZ_USER }}@${{ secrets.KZ_HOST }}" '
            set -e
            cd /opt/olnoo/projects/olnoo-property
            git checkout main
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm build
            systemctl restart olnoo-property
          '
